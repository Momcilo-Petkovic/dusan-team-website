# ============================================================================
#  Dušan Team backend configuration
#
#  This file is committed and contains NO secrets: every sensitive value is read
#  from an environment variable. For local development, put your real values in
#  backend/dusanteam-backend/application-local.properties (gitignored, see README).
# ============================================================================

# Optional local overrides (gitignored)
spring.config.import=optional:file:./application-local.properties

# Database (MariaDB). The database is created automatically if it doesn't exist.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dusanteam?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate creates and updates the tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Gmail SMTP for the contact form. Leave MAIL_USERNAME empty to only store
# messages in the database (no email is sent).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary image hosting (gallery and home page slides)
cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_KEY:}
cloudinary.api-secret=${CLOUDINARY_SECRET:}

# Admin panel login. If ADMIN_PASSWORD is empty, a random password is
# generated at startup and printed in the log.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Uploads: Cloudinary's free plan accepts images up to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=100MB
